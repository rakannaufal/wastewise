name: WasteWise checks
on: [push, pull_request]
jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      - run: npm ci --prefix web
      - run: npm ci --prefix mobile
      - run: npm run check
      - run: node --experimental-strip-types --test shared/photo-location.test.ts
      - run: node --experimental-strip-types --test shared/filters.test.ts
      - run: node --test mobile/scripts/photo-upload.test.mjs
      - run: npm run build
      - run: npm --prefix mobile run export
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: wastewise_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ephemeral-ci-password@localhost:5432/wastewise_test
      JWT_SECRET: ephemeral-ci-only-secret-at-least-32-characters
      ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend-ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - run: alembic upgrade head
      - run: ruff check app ml tests scripts migrations
      - run: mypy app
      - run: pytest -q
