name: WasteWise checks
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      - run: npm ci --prefix web
      - run: npm ci --prefix mobile
      - run: npm audit --audit-level=high --prefix web
      - run: npm audit --audit-level=high --prefix mobile
      - run: npm run check
      - run: node --experimental-strip-types --test shared/photo-location.test.ts
      - run: node --experimental-strip-types --test shared/filters.test.ts
      - run: node --test mobile/scripts/photo-upload.test.mjs
      - name: Reject non-public production API origins
        run: |
          output="$(VITE_API_URL=https://127.0.0.1. npm --prefix web run build 2>&1)" && exit 1
          printf '%s\n' "$output" | grep -Fq "VITE_API_URL must be a public origin; production requires HTTPS."
      - run: npm run build
        env:
          VITE_API_URL: https://api.ci.example
      - run: npm --prefix mobile run export
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: wastewise_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ephemeral-ci-password@localhost:5432/wastewise_test
      DATABASE_URL: postgresql+psycopg://wastewise_tests:ephemeral-ci-runtime-password@localhost:5432/wastewise_test
      JWT_SECRET: ephemeral-ci-only-secret-at-least-32-characters
      ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend-ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - run: DATABASE_URL="$MIGRATION_DATABASE_URL" alembic upgrade head
      - run: >-
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c
          "CREATE ROLE wastewise_tests LOGIN PASSWORD 'ephemeral-ci-runtime-password';
          GRANT CONNECT ON DATABASE wastewise_test TO wastewise_tests;
          GRANT USAGE ON SCHEMA app_private TO wastewise_tests;
          REVOKE CREATE ON SCHEMA app_private FROM wastewise_tests;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA app_private TO wastewise_tests;"
      - run: DATABASE_URL="$MIGRATION_DATABASE_URL" alembic check
      - run: pip-audit -r requirements-dev.lock --strict
      - run: ruff check app ml tests scripts migrations
      - run: mypy app
      - run: pytest -q
